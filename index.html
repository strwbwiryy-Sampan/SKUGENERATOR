<body>
    <div class = "SKU-buttons">
    <form>
        <label for="search">SKU GENERATOR</label>
        <br>
        <select id="Categories">
            <option value="">Categories</option>
            <option value="5">Appliances (+100)</option>
            <option value="29">Furniture (+1000)</option>
            <option value="59">Toys (+50)</option>
            <option value="105">Food (+30)</option>
        </select>

      
        <br>
        <input type="text" id="prodname" placeholder="Product Name" required>
        <button type="button" py-click="search_item" id="prodsearch">Search</button>
        <br>
        <input type="number" id="stkqty" placeholder="Stock Quantity" required>
        <button type="button" py-click="calculate_qty" id="calcu">Calculate</button>
        <br>
        <input type="text" id="item" placeholder="Generate SKU" required>
        <button type="button" py-click="generate" id="generate">Generate</button>
        <br>


    

      
    </form>
    </div>

    </div>
